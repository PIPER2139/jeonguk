<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>전국 더하기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f6f3; --panel:#ffffff; --ink:#1f2a27; --mute:#6b7773; --line:#e3e8e4; --soft:#eef3f0;
  --accent:#23876f; --accent-ink:#ffffff; --accent-soft:#e2f1ec;
  --c-famous:#3b6fd8; --c-hidden:#2f9a5a; --c-food:#d9772b; --c-market:#b0478f; --c-stay:#7a6bd1;
  --shadow:0 1px 2px rgba(20,40,30,.06),0 8px 24px rgba(20,40,30,.06);
  --r:14px;
}
:root.dark{
  --bg:#121715; --panel:#1a211e; --ink:#e7ece9; --mute:#93a29c; --line:#2a3430; --soft:#202925;
  --accent:#43b393; --accent-ink:#0d1412; --accent-soft:#1d3a31;
  --c-famous:#7aa2f0; --c-hidden:#5cc488; --c-food:#f0a160; --c-market:#de7cc0; --c-stay:#a99cf0;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
a{color:var(--accent)}
.wrap{max-width:760px;margin:0 auto;padding:0 18px 80px}
header.top{display:flex;align-items:center;gap:10px;padding:16px 0 6px}
.logo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:17px;letter-spacing:-.02em}
.logo .plus{width:26px;height:26px;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:18px;line-height:1}
.spacer{flex:1}
.ibtn{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--mute);transition:.15s}
.ibtn:hover{background:var(--soft);color:var(--ink)}
.ibtn svg{width:19px;height:19px}
.engine{font-size:12px;color:var(--mute);padding:4px 9px;border-radius:99px;background:var(--soft);white-space:nowrap}
.engine b{color:var(--accent);font-weight:600}

/* hero */
.hero{padding:34px 0 8px}
.hero h1{font-size:28px;letter-spacing:-.03em;margin:0 0 4px;font-weight:700}
.hero p.sub{margin:0 0 20px;color:var(--mute)}
.ask{background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:8px 8px 8px 16px;display:flex;align-items:center;gap:6px}
.ask input{flex:1;border:0;outline:0;background:transparent;font-size:17px;padding:10px 0;min-width:0}
.ask input::placeholder{color:var(--mute);opacity:.7}
.go{background:var(--accent);color:var(--accent-ink);border-radius:12px;padding:11px 18px;font-weight:600;display:flex;align-items:center;gap:6px;white-space:nowrap}
.go:disabled{opacity:.5;cursor:default}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:5px 12px;font-size:13px;color:var(--mute);transition:.15s}
.chip:hover{color:var(--ink)}
.chip.on{background:var(--accent-soft);border-color:transparent;color:var(--accent);font-weight:600}
#btnGps,#btnAcc{border-style:dashed}
#btnAcc.on{border-style:solid}
.acc{font-size:12.5px;margin-top:6px;padding:5px 9px;border-radius:8px;background:color-mix(in srgb,var(--c-famous) 9%,transparent);color:var(--ink)}
.acc.warn{background:color-mix(in srgb,var(--c-food) 13%,transparent)}
.accnote{font-size:12.5px;margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--soft);color:var(--mute)}
#accField.flash{animation:flash 1.2s}
@keyframes flash{30%{box-shadow:0 0 0 3px var(--accent-soft)}}
#btnGps.on{border-style:solid}
#btnGps .x{margin-left:6px;opacity:.6}
.more-toggle{font-size:13px;color:var(--mute);margin-top:12px;display:inline-flex;align-items:center;gap:4px}
.more-toggle:hover{color:var(--ink)}
.adv{display:none;margin-top:12px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px}
.adv.open{display:grid}
.field label{display:block;font-size:12px;color:var(--mute);margin-bottom:4px}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:8px 10px;outline:0}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent)}
.field.wide{grid-column:1/-1}
.seg{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:2px}
.seg button{flex:1;padding:6px 4px;white-space:nowrap;border-radius:7px;font-size:13px;color:var(--mute)}
.seg button.on{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08);font-weight:600}
input[type=range]{accent-color:var(--accent);padding:0!important;border:0!important;background:none!important}
.range-row{display:flex;justify-content:space-between;font-size:11px;color:var(--mute)}

/* loading */
.loading{display:none;margin:28px 0;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.loading.on{display:block}
.steps{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:14px}
.step{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mute);padding:8px 10px;border-radius:10px;background:var(--bg);transition:.3s}
.step.done{color:var(--ink)}
.step .dot{width:8px;height:8px;border-radius:50%;background:var(--line);flex:none}
.step.done .dot{background:var(--accent)}
.step.now .dot{background:var(--accent);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.3}}
.bar{height:3px;background:var(--soft);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;width:30%;background:var(--accent);animation:slide 1.4s infinite ease-in-out}
@keyframes slide{0%{margin-left:-30%}100%{margin-left:100%}}

/* result */
.result{display:none;margin-top:28px}
.result.on{display:block}
.rhead{display:flex;align-items:flex-start;gap:10px}
.rhead h2{margin:0;font-size:22px;letter-spacing:-.02em;outline:0}
.rhead h2:focus{background:var(--soft);border-radius:6px}
.rmeta{color:var(--mute);font-size:13px;margin-top:2px}
.summary{margin:10px 0 0;color:var(--ink);opacity:.85;font-size:14px}
.spec{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.spec a{font-size:12px;text-decoration:none;color:var(--c-food);background:color-mix(in srgb,var(--c-food) 12%,transparent);padding:3px 10px;border-radius:99px}
.tabs{display:flex;gap:2px;margin:20px 0 14px;border-bottom:1px solid var(--line)}
.tabs button{padding:9px 14px;font-size:14px;color:var(--mute);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--ink);border-color:var(--accent);font-weight:600}
.days{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.days button{flex:none;padding:7px 14px;border-radius:10px;background:var(--panel);border:1px solid var(--line);font-size:13px;color:var(--mute)}
.days button.on{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:600}
.daytheme{font-size:13px;color:var(--mute);margin:12px 0 6px;display:flex;align-items:center;gap:8px}
.daytheme .regen{margin-left:auto;font-size:12px;color:var(--mute);padding:3px 8px;border-radius:7px}
.daytheme .regen:hover{background:var(--soft);color:var(--ink)}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--mute);margin:6px 0 4px}
.legend button{display:flex;align-items:center;gap:5px;color:inherit;opacity:1;transition:.15s}
.legend button.off{opacity:.35}
.legend i{width:8px;height:8px;border-radius:50%;display:inline-block}

.timeline{list-style:none;margin:8px 0 0;padding:0}
.item{display:grid;grid-template-columns:54px 1fr;gap:12px;position:relative}
.item .t{font-size:13px;font-variant-numeric:tabular-nums;color:var(--mute);padding-top:14px;text-align:right;cursor:text}
.item .t:hover{color:var(--ink)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px 12px 16px;position:relative;transition:box-shadow .15s,transform .15s;border-left:3px solid var(--cat)}
.card:hover{box-shadow:var(--shadow)}
.item.dragging .card{opacity:.4}
.item.over .card{transform:translateY(4px);box-shadow:0 -3px 0 var(--accent)}
.item.now .card{outline:2px solid var(--accent);outline-offset:2px}
.item.dim{display:none}
.card .top{display:flex;align-items:center;gap:8px}
.card .cat{font-size:11px;color:var(--cat);font-weight:600;letter-spacing:.02em}
.card .cost{margin-left:auto;font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums;cursor:text}
.card .name{font-weight:600;font-size:16px;margin:2px 0 2px;letter-spacing:-.01em}
.card .desc{font-size:13.5px;color:var(--mute);margin:0}
.card .extra{display:none;margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);font-size:13px}
.card.open .extra{display:block}
.card .extra .tip{color:var(--ink);opacity:.85}
.card .extra .memo{margin-top:6px;color:var(--accent);white-space:pre-wrap}
.card .links{display:flex;gap:12px;margin-top:8px;font-size:12px;flex-wrap:wrap}
.card .links a{text-decoration:none}
.card .more{position:absolute;top:8px;right:6px;opacity:0;width:28px;height:28px;border-radius:8px;display:grid;place-items:center;color:var(--mute);background:var(--panel)}
.card:hover .more,.card:focus-within .more{opacity:1}
.card:hover .cost{visibility:hidden}
.card .more:hover{background:var(--soft)}
.card .grip{position:absolute;left:-1px;top:0;bottom:0;width:12px;cursor:grab}
.leg{grid-column:2;font-size:12px;color:var(--mute);padding:5px 0 5px 14px;border-left:2px dotted var(--line);margin-left:10px}
.leg.big{color:var(--c-food)}
.from{font-size:13px;color:var(--mute);border:1px dashed var(--line);border-radius:12px;padding:9px 14px;background:var(--panel)}
.from b{color:var(--ink);font-weight:600}
.kpin{width:24px;height:24px;border-radius:50%;color:#fff;font:700 11px/1 "IBM Plex Sans KR",sans-serif;display:grid;place-items:center;border:2.5px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.3);cursor:pointer}
.kpop{background:#fff;color:#1f2a27;padding:10px 26px 10px 12px;border-radius:10px;box-shadow:0 6px 20px rgba(0,0,0,.22);max-width:250px;font-size:12.5px;line-height:1.45;position:relative;white-space:normal}
.kpop .kx{position:absolute;top:4px;right:6px;color:#888;font-size:12px}
.memo-badge{font-size:11px;color:var(--accent)}
.addrow{grid-column:2;margin-top:10px}
.addrow button{font-size:13px;color:var(--mute);padding:8px 12px;border:1px dashed var(--line);border-radius:10px;width:100%;text-align:left}
.addrow button:hover{color:var(--ink);border-color:var(--mute)}

.refine{margin-top:22px;display:flex;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px 6px 6px 12px;align-items:center}
.refine input{flex:1;border:0;outline:0;background:transparent;font-size:14px;min-width:0}
.refine .spark{color:var(--accent)}
.refine button{font-size:13px;padding:7px 12px;border-radius:9px;background:var(--soft)}
.refine button:hover{background:var(--accent-soft);color:var(--accent)}

/* map */
.mapbox{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.mapbox svg{display:block;width:100%;height:auto}
.maptools{display:flex;gap:8px;align-items:center;padding:10px 12px;border-top:1px solid var(--line);font-size:12px;color:var(--mute);flex-wrap:wrap}
.maplist{margin-top:12px;display:grid;gap:6px}
.maplist a{display:flex;gap:10px;align-items:center;text-decoration:none;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:14px}
.maplist a span.n{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:11px;color:#fff;flex:none}
.maplist a small{margin-left:auto;color:var(--mute)}

/* budget */
.bud-total{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.bud-total .big{font-size:30px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.bud-total .pp{color:var(--mute)}
.bud-rows{margin-top:16px;display:grid;gap:12px}
.bud-row .lab{display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px}
.bud-row .lab span:last-child{font-variant-numeric:tabular-nums;color:var(--mute)}
.bud-row .track{height:8px;border-radius:4px;background:var(--soft);overflow:hidden}
.bud-row .track i{display:block;height:100%;border-radius:4px}
.note{font-size:12px;color:var(--mute);margin-top:14px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px}

/* checklist */
.check{list-style:none;padding:0;margin:0}
.check li{display:flex;align-items:center;gap:10px;padding:9px 2px;border-bottom:1px solid var(--line);font-size:14px}
.check li.done span{text-decoration:line-through;color:var(--mute)}
.check input{accent-color:var(--accent);width:17px;height:17px}
.check li button{margin-left:auto;color:var(--mute);opacity:0;font-size:13px}
.check li:hover button{opacity:1}
.addcheck{display:flex;gap:8px;margin-top:10px}
.addcheck input{flex:1;border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:8px 10px;outline:0}

/* overlays */
.scrim{position:fixed;inset:0;background:rgba(10,20,15,.35);backdrop-filter:blur(2px);display:none;z-index:40}
.scrim.on{display:block}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(520px,calc(100vw - 28px));max-height:calc(100vh - 40px);overflow:auto;background:var(--panel);border-radius:18px;box-shadow:0 20px 60px rgba(0,0,0,.25);z-index:50;display:none;padding:22px}
.modal.on{display:block}
.modal h3{margin:0 0 4px;font-size:18px}
.modal .lead{color:var(--mute);font-size:13px;margin:0 0 16px}
.modal .row{margin-bottom:14px}
.modal .actions{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}
.btn{padding:9px 14px;border-radius:10px;background:var(--soft);font-size:14px}
.btn.pri{background:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.danger{color:#c4433a}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(380px,92vw);background:var(--panel);z-index:50;transform:translateX(105%);transition:transform .25s ease;box-shadow:-10px 0 40px rgba(0,0,0,.15);display:flex;flex-direction:column}
.drawer.on{transform:none}
.drawer header{display:flex;align-items:center;padding:16px 16px 8px}
.drawer header h3{margin:0;font-size:17px;flex:1}
.drawer .list{overflow:auto;padding:4px 12px 20px;flex:1}
.trip-row{display:flex;align-items:center;gap:10px;padding:12px;border-radius:12px;cursor:pointer}
.trip-row:hover{background:var(--soft)}
.trip-row .ti{font-weight:600;font-size:14px}
.trip-row .tm{font-size:12px;color:var(--mute)}
.trip-row .x{margin-left:auto;color:var(--mute);opacity:0}
.trip-row:hover .x{opacity:1}
.empty{color:var(--mute);font-size:13px;padding:20px 12px}
.palette{position:fixed;left:50%;top:14vh;transform:translateX(-50%);width:min(560px,calc(100vw - 24px));background:var(--panel);border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.3);z-index:60;display:none;overflow:hidden}
.palette.on{display:block}
.palette input{width:100%;border:0;outline:0;padding:16px 18px;font-size:16px;background:transparent;border-bottom:1px solid var(--line)}
.palette ul{list-style:none;margin:0;padding:6px;max-height:50vh;overflow:auto}
.palette li{padding:9px 12px;border-radius:9px;display:flex;align-items:center;gap:10px;font-size:14px;cursor:pointer}
.palette li.sel{background:var(--accent-soft);color:var(--accent)}
.palette li kbd{margin-left:auto}
kbd{font-family:inherit;font-size:11px;color:var(--mute);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:1px 6px;background:var(--bg)}
.menu{position:fixed;z-index:70;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 40px rgba(0,0,0,.18);padding:5px;min-width:200px;display:none}
.menu.on{display:block}
.menu button,.menu a{display:flex;width:100%;text-align:left;padding:8px 10px;border-radius:8px;font-size:13.5px;gap:8px;align-items:center;text-decoration:none;color:var(--ink)}
.menu button:hover,.menu a:hover{background:var(--soft)}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 0}
.menu .danger{color:#c4433a}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:80;opacity:0;transition:.25s;pointer-events:none;max-width:calc(100vw - 32px)}
.toast.on{opacity:1;transform:translateX(-50%);pointer-events:auto}
.toast button{color:var(--accent);margin-left:10px;font-weight:600}
:root.dark .toast button{color:var(--accent-soft)}
.err{background:color-mix(in srgb,#c4433a 10%,var(--panel));border:1px solid color-mix(in srgb,#c4433a 30%,transparent);color:var(--ink);padding:12px 14px;border-radius:12px;font-size:14px;margin-top:16px;display:none}
.err.on{display:block}
.privacy{display:grid;gap:10px}
.privacy .p{display:flex;gap:12px;padding:12px;border-radius:12px;background:var(--bg)}
.privacy .p b{display:block;font-size:14px}
.privacy .p span{font-size:12.5px;color:var(--mute)}
.privacy .ico{font-size:18px}
.stat{font-size:13px;background:var(--bg);border-radius:10px;padding:10px 12px;margin-top:10px;color:var(--mute)}
.shortcuts{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;font-size:14px;align-items:center}
.foot{margin-top:60px;color:var(--mute);font-size:12px;text-align:center}
.foot button{color:var(--mute);text-decoration:underline}
#printArea{position:fixed;left:-10000px;top:0;width:794px;background:#fff;color:#111;padding:40px;font-family:"IBM Plex Sans KR",sans-serif}
@media (max-width:560px){
  .hero h1{font-size:23px}
  .go span{display:none}
  .item{grid-template-columns:44px 1fr;gap:8px}
  .card .more{opacity:1}
  .card:hover .cost{visibility:visible}
  .card .cost{margin-right:26px}
  .steps{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="logo"><span class="plus">+</span>전국 더하기</div>
    <div class="spacer"></div>
    <span class="engine" id="engineBadge" title="일정을 만드는 AI 엔진">엔진 확인 중…</span>
    <button class="ibtn" id="btnSaved" title="저장한 일정 (S)" aria-label="저장한 일정"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12v18l-6-4-6 4z"/></svg></button>
    <button class="ibtn" id="btnMenu" title="더보기 (⌘K)" aria-label="더보기"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg></button>
  </header>

  <section class="hero" id="hero">
    <h1>어디로 떠나볼까요?</h1>
    <p class="sub">지역 · 기간 · 테마만 적으면, 숨은 명소까지 더한 일정을 만들어 드려요.</p>
    <form class="ask" id="askForm" autocomplete="off">
      <input id="q" placeholder="익산 / 2박 3일 / 로컬 미식" aria-label="여행 조건">

function nearAirports(o,filter){return Object.entries(AIRPORTS).filter(([c,a])=>filter(a,c)).map(([c,a])=>({code:c,...a,d:km(o,a)})).sort((x,y)=>x.d-y.d)}

/* ============ 암호화 저장소 (AES-GCM, 키는 추출 불가 상태로 IndexedDB 보관) ============ */
const Vault={
  key:null,
  async getKey(){
    if(this.key)return this.key;
    if(!window.crypto?.subtle||!window.indexedDB)throw new Error('no-crypto');
    const db=await new Promise((res,rej)=>{const r=indexedDB.open('jeonguk-plus',1);r.onupgradeneeded=()=>r.result.createObjectStore('k');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
    const get=()=>new Promise((res,rej)=>{const q=db.transaction('k').objectStore('k').get('aes');q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)});
    let k=await get();
    if(!k){
      k=await crypto.subtle.generateKey({name:'AES-GCM',length:256},false,['encrypt','decrypt']);
      await new Promise((res,rej)=>{const tx=db.transaction('k','readwrite');tx.objectStore('k').put(k,'aes');tx.oncomplete=res;tx.onerror=()=>rej(tx.error)});
    }
    return this.key=k;
  },
  async enc(obj){
    const k=await this.getKey();const iv=crypto.getRandomValues(new Uint8Array(12));
    const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},k,new TextEncoder().encode(JSON.stringify(obj)));
    return {iv:b64(iv),ct:b64(new Uint8Array(ct))};
  },
  async dec(box){
    const k=await this.getKey();
    const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(box.iv)},k,unb64(box.ct));
    return JSON.parse(new TextDecoder().decode(pt));
  },
  async put(name,obj){try{LS.set('jp.'+name,await this.enc(obj));return true}catch(e){console.warn(e);return false}},
  async get(name,d){const box=LS.get('jp.'+name,null);if(!box)return d;try{return await this.dec(box)}catch{return d}},
  async wipe(){
    Object.keys(localStorage).filter(k=>k.startsWith('jp.')).forEach(k=>LS.del(k));
    try{indexedDB.deleteDatabase('jeonguk-plus')}catch{}
    this.key=null;
  }
};
function b64(u8){let s='';u8.forEach(b=>s+=String.fromCharCode(b));return btoa(s)}
function unb64(s){return Uint8Array.from(atob(s),c=>c.charCodeAt(0))}

/* ============ 저장된 일정 + 보존기간 자동 삭제 ============ */
async function loadSaved(){
  const list=await Vault.get('trips',[]);
  const now=Date.now();
  const kept=list.filter(r=>!r.expireAt||r.expireAt>now);
  if(kept.length!==list.length){await Vault.put('trips',kept);toast(`보존 기간이 지난 일정 ${list.length-kept.length}개를 자동 삭제했어요`)}
  return kept;
}
function expiryFor(trip){
  const days=S.settings.retention;
  if(days<0)return null; // 영구 보관
  const base=trip.startDate?new Date(trip.startDate).getTime()+(trip.days.length)*864e5:Date.now()+30*864e5;
  return base+days*864e5;
}
async function saveTrip(silent){
  if(!S.trip)return;
  readTitle();
  const list=await loadSaved();
  const i=list.findIndex(r=>r.id===S.trip.id);
  const rec={id:S.trip.id,savedAt:Date.now(),expireAt:expiryFor(S.trip),trip:S.trip};
  if(i>=0)list[i]=rec;else list.unshift(rec);
  const ok=await Vault.put('trips',list);
  if(!silent)toast(ok?'암호화해서 이 브라우저에 저장했어요':'이 보기에서는 저장소를 쓸 수 없어요',ok?{label:'저장함',fn:openSaved}:null);
}

function parseQuery(q){
  const out={region:'',days:0,nights:0,theme:''};
  let str=' '+q+' ';
  let m;
  if((m=str.match(/(\d+)\s*박\s*(\d+)\s*일/))){out.nights=+m[1];out.days=+m[2];str=str.replace(m[0],' ')}
  else if((m=str.match(/[\s\/,](당일(?:치기)?|하루)(?=[\s\/,])/))){out.days=1;out.nights=0;str=str.replace(m[1],' ')}
  else if((m=str.match(/[\s\/,](주말)(?=[\s\/,])/))){out.days=2;out.nights=1;str=str.replace(m[1],' ')}
  else if((m=str.match(/[\s\/,](\d+)\s*일(?=[\s\/,])/))){out.days=+m[1];out.nights=Math.max(0,out.days-1);str=str.replace(m[1]+'일',' ')}
  let parts=str.split(/[\/,·|]+/).map(s=>s.trim()).filter(Boolean);
  if(parts.length===1&&/\s/.test(parts[0])){const w=parts[0].split(/\s+/);parts=[w[0],w.slice(1).join(' ')]}
  out.region=parts[0]||'';out.theme=parts.slice(1).join(', ');
  return out;
}

const okLL=(a,b)=>isFinite(a)&&isFinite(b)&&Math.abs(a)<=90&&Math.abs(b)<=180&&!(a===0&&b===0);

/* ============ 거리/이동시간 ============ */
function km(a,b){const R=6371,r=Math.PI/180,dl=(b.lat-a.lat)*r,dg=(b.lng-a.lng)*r;const h=Math.sin(dl/2)**2+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dg/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
const RIC={TRANSIT:'🚇',DRIVE:'🚗',WALK:'🚶',BICYCLE:'🚲'};
const legSig=(a,b,mode)=>`${(+a.lat).toFixed(5)},${(+a.lng).toFixed(5)}>${(+b.lat).toFixed(5)},${(+b.lng).toFixed(5)}|${mode}`;
function leg(a,b,mode){
  if(a.lat==null||b.lat==null)return null;
  if(b.flight){const d=km(a,b);const min=b.flightMin||Math.round(d/750*60+30);return {d,min,ic:'✈️',flight:true,summary:'비행'}}
  const r=b.route;
  if(r&&r.sig===legSig(a,b,mode))return {d:r.km,min:Math.max(1,r.min),ic:RIC[r.gmode]||'🧭',real:true,summary:r.summary||'',fare:r.fare||0,gmode:r.gmode,poly:r.poly};
  const d=km(a,b)*1.35;
  let ic,min;
  const slow=isSlow(S.trip&&S.trip.req);
  if(d<(slow?0.6:1.0)){ic=slow?'♿':'🚶';min=d/(slow?3:4.5)*60}
  else if(d>30&&mode==='car'){ic='🚗';min=d/75*60+15}
  else if(d>30){ic='🚄';min=d/90*60+30}
  else if(mode==='car'){ic='🚗';min=d/35*60+4}
  else if(mode==='walk'&&d<15){ic=d<3?'🚶':'🚲';min=d<3?d/4.5*60:d/13*60}
  else{ic='🚌';min=d/22*60+9}
  if(slow&&d>=0.6)min+=8; // 승하차·환승 여유
  return {d,min:Math.max(2,Math.round(min)),ic};
}
function prevAnchor(t,di){if(di<=0)return null;const it=t.days[di-1].items;for(let i=it.length-1;i>=0;i--)if(it[i].lat!=null)return it[i];return null}
function dayPairs(t,di){const it=t.days[di].items,out=[];const an=prevAnchor(t,di);const f=it.find(x=>x.lat!=null)||it[0];if(an&&f)out.push([an,f,true]);for(let i=1;i<it.length;i++)out.push([it[i-1],it[i],false]);return out}
const fmtMin=m=>m>=60?`${Math.floor(m/60)}시간 ${m%60?m%60+'분':''}`.trim():`${m}분`;
const toMin=t=>{const[h,m]=(t||'0:0').split(':').map(Number);return h*60+m};
const fromMin=m=>{m=Math.max(0,Math.min(1439,Math.round(m/5)*5));return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0')};
function reflow(day,start){
  const it=day.items;if(!it.length)return;
  if(start)it[0].time=start;
  if(!it[0].time)it[0].time='09:30';
  for(let i=1;i<it.length;i++){
    const l=leg(it[i-1],it[i],S.trip.transport);
    it[i].time=fromMin(toMin(it[i-1].time)+it[i-1].duration+(l?l.min:15));
  }
}

function loadKakao(){
  if(window.kakao&&kakao.maps&&kakao.maps.services)return Promise.resolve(kakao.maps);
  if(kakaoPromise)return kakaoPromise;
  kakaoPromise=(async()=>{
    const k=await kakaoJSKey();if(!k)throw new Error('no-key');
    await new Promise((res,rej)=>{
      const sc=document.createElement('script');
      sc.src=`https://dapi.kakao.com/v2/maps/sdk.js?appkey=${encodeURIComponent(k)}&autoload=false&libraries=services`;
      sc.onload=()=>{try{kakao.maps.load(res)}catch(e){rej(e)}};sc.onerror=()=>rej(new Error('load'));
      document.head.appendChild(sc);setTimeout(()=>rej(new Error('timeout')),12000);
    });
    return kakao.maps;
  })();
  kakaoPromise.catch(e=>{if(e.message!=='no-key')kakaoFailed=true;kakaoPromise=null});
  return kakaoPromise;
}
const kName=n=>String(n).replace(/[,/]/g,' ').trim();
const kakaoLink=x=>x.lat!=null?`https://map.kakao.com/link/map/${encodeURIComponent(kName(x.name))},${x.lat},${x.lng}`:'https://map.kakao.com/link/search/'+encodeURIComponent((S.trip?.region&&!x.name.includes(S.trip.region)?S.trip.region+' ':'')+x.name);
const kakaoRoute=(a,b)=>`https://map.kakao.com/link/from/${encodeURIComponent(kName(a.name))},${a.lat},${a.lng}/to/${encodeURIComponent(kName(b.name))},${b.lat},${b.lng}`;
function hasMix(t){const p=t.days.flatMap(d=>d.items).filter(x=>x.lat!=null);return p.some(x=>inKR(x.lat,x.lng))&&p.some(x=>!inKR(x.lat,x.lng))}
function tripInKR(t){if(!t)return true;const pts=t.days.flatMap(d=>d.items).filter(x=>x.lat!=null&&!isSys(x));if(!pts.length)return /^[가-힣\s]+$/.test(t.region);return pts.filter(x=>inKR(x.lat,x.lng)).length>=pts.length/2}

async function kakaoSearch(q,ctr){
  const one=async(useLoc)=>{
    try{
      const km_=await loadKakao();const ps=new km_.services.Places();
      const opts={size:1};if(useLoc&&ctr){opts.location=new km_.LatLng(ctr.lat,ctr.lng);opts.radius=20000}
      return await new Promise(res=>ps.keywordSearch(q,(d,st)=>res(st===km_.services.Status.OK&&d[0]?{lat:+d[0].y,lng:+d[0].x,addr:d[0].road_address_name||d[0].address_name}:null),opts));
    }catch(e){if(!hasKakaoREST)throw e}
    const rk=await Vault.get('krest','');
    const u=new URL('https://dapi.kakao.com/v2/local/search/keyword.json');u.searchParams.set('query',q);u.searchParams.set('size','1');
    if(useLoc&&ctr){u.searchParams.set('x',ctr.lng);u.searchParams.set('y',ctr.lat);u.searchParams.set('radius','20000')}
    const r=await fetch(u,{headers:{Authorization:'KakaoAK '+rk}});const j=await r.json().catch(()=>({}));
    if(!r.ok)throw new Error(j.message||('Kakao '+r.status));
    const d=j.documents&&j.documents[0];return d?{lat:+d.y,lng:+d.x,addr:d.road_address_name||d.address_name}:null;
  };
  return (await one(true))||(ctr?await one(false):null);
}
async function kakaoRegion(lat,lng){
  try{
    const km_=await loadKakao();const g=new km_.services.Geocoder();
    const d=await new Promise(res=>g.coord2RegionCode(lng,lat,(r,st)=>res(st===km_.services.Status.OK?(r.find(x=>x.region_type==='H')||r[0]):null)));
    if(d)return d;
  }catch{}
  const rk=await Vault.get('krest','');if(!rk)return null;
  const r=await fetch(`https://dapi.kakao.com/v2/local/geo/coord2regioncode.json?x=${lng}&y=${lat}`,{headers:{Authorization:'KakaoAK '+rk}});
  const j=await r.json().catch(()=>({}));return (j.documents||[]).find(x=>x.region_type==='H')||null;
}
const gmapLink=x=>'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(x.lat!=null&&x.fixed?x.lat+','+x.lng:((S.trip?.region&&!x.name.includes(S.trip.region)?S.trip.region+' ':'')+x.name));
function gcal(x,dayIdx){

function getPosition(){
  return new Promise((res,rej)=>{
    if(!navigator.geolocation)return rej(new Error('이 브라우저는 위치 기능을 지원하지 않아요.'));
    navigator.geolocation.getCurrentPosition(p=>res(p.coords),e=>rej(new Error(
      e.code===1?'위치 권한이 거부됐어요. 주소창 왼쪽의 자물쇠/설정 아이콘에서 위치 권한을 허용해 주세요.':
      e.code===3?'위치를 찾는 데 시간이 너무 오래 걸려요. 다시 시도해 주세요.':'현재 위치를 찾을 수 없어요. GPS나 Wi-Fi를 켜 주세요.')),
      {enableHighAccuracy:true,timeout:15000,maximumAge:60000});
  });
}
async function reverseLabel(lat,lng){
  if((hasKakaoJS||hasKakaoREST)&&inKR(lat,lng)){try{const d=await kakaoRegion(lat,lng);if(d&&d.region_1depth_name)return {label:[d.region_2depth_name,d.region_3depth_name].filter(Boolean).join(' ')||d.region_1depth_name,coarse:[d.region_1depth_name,d.region_2depth_name].filter(Boolean).join(' ')}}catch{}}
  try{
    const gm=await loadGMaps();
    const r=await new gm.Geocoder().geocode({location:{lat,lng},language:'ko'});
    const res=r.results||[];
    const comp=t=>{for(const x of res)for(const c of x.address_components)if(c.types.includes(t))return c.long_name;return ''};
    const l1=comp('administrative_area_level_1'),loc=comp('locality'),s1=comp('sublocality_level_1'),s2=comp('sublocality_level_2')||comp('sublocality_level_3');
    const coarse=[l1,loc&&loc!==l1?loc:'',s1].filter(Boolean).join(' ');
    const label=[loc||l1,s1,s2].filter(Boolean).slice(-2).join(' ')||coarse;
    if(coarse)return {label,coarse};
  }catch{}
  return {label:'현재 위치',coarse:`위도 ${lat.toFixed(2)}, 경도 ${lng.toFixed(2)} 부근`};
}
async function locateMe(applyToTrip){
  const b=$('#btnGps');const old=b.innerHTML;b.textContent='📍 위치 찾는 중…';
  try{
    const c=await getPosition();
    const lat=+c.latitude.toFixed(6),lng=+c.longitude.toFixed(6);
    const nm=await reverseLabel(lat,lng);
    S.origin={lat,lng,label:nm.label,coarse:nm.coarse,acc:Math.round(c.accuracy||0)};
    renderOrigin();
    toast(`${nm.label}을(를) 출발지로 정했어요${c.accuracy>500?` (오차 약 ${Math.round(c.accuracy)}m)`:''}`);
    if(applyToTrip&&S.trip){snap();S.trip.origin={lat,lng,label:nm.label};applyOrigin(S.trip);changed()}
  }catch(e){b.innerHTML=old;renderOrigin();toast(e.message)}
}
function applyOrigin(t){
  t.days.forEach(d=>{d.items=d.items.filter(x=>!isSys(x));d.items.forEach(x=>{delete x.flight;delete x.flightMin})});
  const o=t.origin;if(!o||!t.days.length)return;
  const d0=t.days[0],dl=t.days[t.days.length-1];
  const acts=t.days.flatMap(d=>d.items).filter(x=>x.lat!=null);
  const first=d0.items.find(x=>x.lat!=null)||d0.items[0];
  const lastAct=[...dl.items].reverse().find(x=>x.lat!=null)||dl.items[dl.items.length-1];
  const mk=(id,name,cat,desc,p,extra)=>{const x=normItem({id,name,category:cat,desc,tip:'',lat:p.lat,lng:p.lng,cost:0,address:p.addr||''});x.duration=0;x.fixed=true;return Object.assign(x,extra||{})};
  const st=mk('origin-start',`출발 · ${o.label}`,'start','현재 위치에서 출발해요',{...o,addr:o.label});
  const en=mk('origin-end',`도착 · ${o.label}`,'start','출발했던 곳으로 돌아와요',{...o,addr:o.label});
  // 비행이 필요한지: 출발지는 육지(한국), 목적지는 해외·제주·울릉 등
  const ctr=acts.length?{lat:acts.reduce((a,x)=>a+x.lat,0)/acts.length,lng:acts.reduce((a,x)=>a+x.lng,0)/acts.length}:null;
  const oKR=inKR(o.lat,o.lng)&&!isJeju(o.lat,o.lng);
  const intl=ctr&&oKR&&!inKR(ctr.lat,ctr.lng);
  const island=ctr&&oKR&&isJeju(ctr.lat,ctr.lng);
  const tv=t.travel||{};
  if(intl||island){
    const dep=pickDepAirport(o,ctr,intl,String(tv.departAirport||'').toUpperCase());
    const A=AIRPORTS[dep];
    let arr=island?{name:'제주국제공항',code:'CJU',lat:AIRPORTS.CJU.lat,lng:AIRPORTS.CJU.lng}:null;
    if(intl&&tv.arrivalAirport&&okLL(+tv.arrivalAirport.lat,+tv.arrivalAirport.lng)&&km(tv.arrivalAirport,ctr)<200)arr={name:tv.arrivalAirport.name||'현지 공항',code:tv.arrivalAirport.code||'',lat:+tv.arrivalAirport.lat,lng:+tv.arrivalAirport.lng};
    const fm=+tv.flightMinutes>20?Math.round(+tv.flightMinutes):null;
    const tz=intl?(isFinite(+tv.utcOffset)&&tv.utcOffset!==''&&tv.utcOffset!=null?+tv.utcOffset:Math.round((arr||ctr).lng/15)):9;
    const tzd=(tz-9)*60; // 현지 - 한국 (분)
    const checkin=intl?120:60, immig=intl?60:20;
    const fcost=Math.max(0,Math.round(+tv.flightCost||0));
    // --- 가는 길
    const depA=mk('air-dep',`${A.n} (${dep}) 출국`,'move',intl?'국제선 체크인·출국 심사 (2시간 전 도착)':'국내선 체크인 (1시간 전 도착)',{lat:A.lat,lng:A.lng,addr:A.n},{duration:checkin,cost:fcost});
    if(fcost)depA.tip='항공권 1인 왕복 대략 금액이에요. 실제 요금은 날짜·항공사에 따라 달라요.';
    let arrA=null;
    if(arr){arrA=mk('air-arr',`${arr.name}${arr.code?` (${arr.code})`:''} 도착`,'move',intl?'입국 심사·수하물 찾기 (현지 시각)':'수하물 찾기',arr,{duration:immig,flight:true,flightMin:fm||undefined});}
    else{first.flight=true;first.flightMin=fm||undefined}
    // 시간: 첫 장소에서 거꾸로 계산
    const T=toMin(first.time||'10:00');
    let arrT=T;
    if(arrA){const l=leg(arrA,first,t.transport);arrT=T-(l?l.min:40)-immig;arrA.time=fromMin(arrT)}
    const fl=leg(depA,arrA||first,t.transport);
    const depT=arrT-(fl?fl.min:120)-tzd-checkin; // 한국 시각
    depA.time=fromMin(depT);
    const g1=leg(st,depA,t.transport);st.time=fromMin(depT-(g1?g1.min:60));
    d0.items.unshift(...[st,depA,arrA].filter(Boolean));
    // --- 오는 길
    let retA=null,homeA;
    const L=lastAct?toMin(lastAct.time||'16:00')+(lastAct.duration||60):16*60;
    if(arr){retA=mk('air-ret',`${arr.name}${arr.code?` (${arr.code})`:''} 출국`,'move',intl?'체크인·출국 심사 (현지 시각)':'체크인',arr,{duration:checkin});
      const l=lastAct?leg(lastAct,retA,t.transport):null;retA.time=fromMin(L+(l?l.min:40))}
    homeA=mk('air-home',`${A.n} (${dep}) 도착`,'move',intl?'입국 심사·수하물 찾기 (한국 시각)':'수하물 찾기',{lat:A.lat,lng:A.lng,addr:A.n},{duration:immig,flight:true,flightMin:fm||undefined});
    const from=retA||lastAct;
    const fl2=from?leg(from,homeA,t.transport):null;
    const homeT=(retA?toMin(retA.time)+checkin:L)+(fl2?fl2.min:120)-tzd;
    homeA.time=fromMin(homeT);
    const g2=leg(homeA,en,t.transport);en.time=fromMin(homeT+immig+(g2?g2.min:60));
    dl.items.push(...[retA,homeA,en].filter(Boolean));
    t.flightInfo={dep,arr:arr&&arr.code,intl:!!intl};
    return;
  }
  t.flightInfo=null;
  if(first){const l=leg(st,first,t.transport);st.time=fromMin(toMin(first.time||'09:30')-(l?l.min:30))}else st.time='09:00';
  d0.items.unshift(st);
  if(lastAct&&lastAct!==st){const l=leg(lastAct,en,t.transport);en.time=fromMin(toMin(lastAct.time||'18:00')+(lastAct.duration||60)+(l?l.min:30))}else en.time='20:00';
  dl.items.push(en);
}

async function generate(){
  showErr('');
  const req=readReq();
  if(!req.region){showErr('여행 지역을 먼저 적어 주세요. 예) 익산 / 2박 3일 / 로컬 미식');$('#q').focus();return}
  if(req.days>7){showErr('한 번에 최대 7일까지 만들 수 있어요.');return}
  if(req.region.length>30){showErr('지역 이름이 너무 길어요. 시·군 이름으로 적어 주세요.');return}
  const eng=activeEngine();
  $('#btnGo').disabled=true;showLoading(true);
  $('#result').classList.remove('on');
  S.abort=new AbortController();
  try{
    let raw;
    if(eng==='demo')raw=await demoTrip(req);
    else raw=await aiJSON(tripPrompt(req),S.abort.signal);
    raw.engine=eng;
    const t=normTrip(raw,req);
    if(S.origin){t.origin={lat:S.origin.lat,lng:S.origin.lng,label:S.origin.label};applyOrigin(t)}
    S.trip=t;S.mapKR=false;S.day=0;S.tab='plan';S.undo=[];S.redo=[];S.hide.clear();
    render();persistDraft();
    $('#result').scrollIntoView({behavior:'smooth',block:'start'});
  }catch(e){
    if(e.name!=='AbortError')showErr(e.message||String(e));
  }finally{
    showLoading(false);$('#btnGo').disabled=false;S.abort=null;
  }
}

일정: ${tripBrief(S.trip)}

let hasRoutesKey=false;const routeTried=new Set();let routeBusy=false;

const routesKey=async()=>(await Vault.get('rkey',''))||(await Vault.get('mkey',''));
function decodePoly(str){const pts=[];let i=0,lat=0,lng=0;while(i<str.length){for(const k of [0,1]){let b,sh=0,r=0;do{b=str.charCodeAt(i++)-63;r|=(b&31)<<sh;sh+=5}while(b>=32);const d=(r&1)?~(r>>1):(r>>1);if(k===0)lat+=d;else lng+=d}pts.push({lat:lat/1e5,lng:lng/1e5})}return pts}
async function computeLeg(a,b,gmode,when){
  const key=await routesKey();if(!key)throw {code:'nokey'};
  const body={origin:{location:{latLng:{latitude:a.lat,longitude:a.lng}}},destination:{location:{latLng:{latitude:b.lat,longitude:b.lng}}},travelMode:gmode,languageCode:'ko',units:'METRIC'};
  if(gmode==='DRIVE')body.routingPreference='TRAFFIC_UNAWARE';
  if(gmode==='TRANSIT'&&isSlow(S.trip&&S.trip.req))body.transitPreferences={routingPreference:'LESS_WALKING'};
  if(when&&when>Date.now()+120000)body.departureTime=new Date(when).toISOString();
  const r=await fetch('https://routes.googleapis.com/directions/v2:computeRoutes',{method:'POST',headers:{'Content-Type':'application/json','X-Goog-Api-Key':key,
    'X-Goog-FieldMask':'routes.duration,routes.distanceMeters,routes.polyline.encodedPolyline,routes.travelAdvisory.transitFare,routes.legs.steps.travelMode,routes.legs.steps.transitDetails.transitLine'},body:JSON.stringify(body)});
  const j=await r.json().catch(()=>({}));
  if(!r.ok)throw {code:r.status,message:(j.error&&j.error.message)||String(r.status)};
  const rt=j.routes&&j.routes[0];if(!rt||!rt.duration)return null;
  const lines=[];(rt.legs||[]).forEach(L=>(L.steps||[]).forEach(st=>{const tl=st.transitDetails&&st.transitDetails.transitLine;if(tl){const nm=tl.nameShort||tl.name;if(nm&&lines[lines.length-1]!==nm)lines.push(nm)}}));
  const f=rt.travelAdvisory&&rt.travelAdvisory.transitFare;
  return {min:Math.round(parseInt(rt.duration)/60),km:(rt.distanceMeters||0)/1000,poly:(rt.polyline&&rt.polyline.encodedPolyline)||'',summary:lines.slice(0,4).join(' → '),fare:f?Math.round((+f.units||0)+(f.nanos||0)/1e9):0,gmode};
}
function modesFor(mode,dkm){
  const slow=isSlow(S.trip&&S.trip.req);
  const m=[];if(dkm<(slow?0.6:0.9))m.push('WALK');
  if(mode==='car')m.push('DRIVE','TRANSIT');
  else if(mode==='walk')m.push(slow?'TRANSIT':dkm<3?'WALK':'BICYCLE','TRANSIT');
  else m.push('TRANSIT');
  if(dkm<(slow?1:2.5))m.push('WALK');
  return [...new Set(m)];
}

async function computeRoutes(dayList,{silent=false,force=false}={}){
  if(routeBusy||!S.trip)return;
  if(!(await routesKey())){if(!silent)toast('Routes API 키가 필요해요 (⌘K → 설정)');return}
  const t=S.trip;const jobs=[];
  dayList.forEach(di=>{dayPairs(t,di).forEach(([a,b,carry])=>{if(a.lat==null||b.lat==null)return;const sig=legSig(a,b,t.transport);if(b.flight)return;if(!force&&b.route&&b.route.sig===sig)return;if(!force&&routeTried.has(sig))return;jobs.push({a,b,sig,di,carry})})});
  if(!jobs.length){if(!silent)toast('이미 모든 구간의 실제 경로를 받아 왔어요');return}
  routeBusy=true;if(!silent)toast(`${jobs.length}개 구간의 실제 경로를 계산하는 중…`);
  let ok=0,fell=0,fail='';
  const base=t.startDate?new Date(t.startDate+'T00:00:00').getTime():0;
  for(const j of jobs){
    routeTried.add(j.sig);
    const dkm=km(j.a,j.b);
    const when=!base?0:j.carry?(j.b.time?base+j.di*864e5+(toMin(j.b.time)-60)*6e4:0):(j.a.time?base+j.di*864e5+(toMin(j.a.time)+j.a.duration)*6e4:0);
    let res=null;
    for(const gm of modesFor(t.transport,dkm)){
      try{res=await computeLeg(j.a,j.b,gm,when)}catch(e){if(e.code==='nokey'||e.code===403||e.code===401||e.code===400&&/key/i.test(e.message)){fail=e.message||String(e.code);break}}
      if(res)break;
    }
    if(fail)break;
    if(res){
      const want=t.transport==='car'?'DRIVE':t.transport==='walk'?(dkm<3?'WALK':'BICYCLE'):'TRANSIT';
      if(res.gmode!==want&&res.gmode!=='WALK')fell++;
      j.b.route={...res,sig:j.sig};ok++;
    }
  }
  routeBusy=false;
  if(fail){if(!silent||!ok)routeHelp(fail);return}
  if(ok){changed();toast(`${ok}개 구간을 실제 경로로 바꿨어요${fell?` (자동차·도보 경로가 없는 ${fell}구간은 대중교통으로)`:''}`,{label:'시간도 맞추기',fn:()=>{snap();dayList.forEach(di=>reflow(t.days[di]));changed();toast('실제 이동 시간에 맞춰 일정을 조정했어요',{label:'되돌리기',fn:undo})}})}
  else if(!silent)toast('Google이 이 구간들의 경로를 찾지 못해 추정치를 유지했어요');
}

async function geoFix(){

      }catch(e){const m=String(e&&(e.code||'')+' '+(e.message||e));console.warn('Geocoder',m);if(isDenied(m))err.geo=m}

  const total=dayIdx.reduce((a,di)=>{dayPairs(t,di).forEach(([x,y])=>{const l=leg(x,y,t.transport);if(l)a.d+=l.d,a.m+=l.min});return a},{d:0,m:0});
  h+=s+`<div class="maptools"><span>총 이동 약 ${total.d.toFixed(1)}km · ${fmtMin(total.m)}</span>${hasRoutesKey?'<button class="btn" data-act="routes" style="padding:5px 10px;font-size:12px">🛣️ 실제 경로</button>':''}${hasMix(t)&&hasKakaoJS&&!kakaoFailed?'<button class="btn" data-act="mapkr" style="padding:5px 10px;font-size:12px">🇰🇷 국내 구간 (카카오맵)</button>':''}<span class="spacer"></span><span>좌표는 AI가 추정한 대략적인 위치예요. 핀을 누르면 네이버 지도로 열려요.</span></div></div>`;
  h+=`<div class="maplist">${list.map(o=>`<a href="${naver(o.x)}" target="_blank" rel="noopener"><span class="n" style="background:${o.col}">${o.n}</span>${esc(o.x.name)}<small>${S.mapAll?(o.di+1)+'일차 ':''}${esc(o.x.time)}</small></a>`).join('')}</div>`;
  return h;
}

function budgetCalc(){
  const t=S.trip,p=t.people,rooms=Math.ceil(p/2);
  const b={sight:0,food:0,stay:0,move:0};
  t.days.forEach((d,di)=>{
    d.items.forEach(x=>{
      if(x.category==='move')b.move+=x.cost*p;
      else if(x.category==='stay')b.stay+=x.cost*rooms;
      else if(x.category==='food')b.food+=x.cost*p;
      else b.sight+=x.cost*p;
    });
    dayPairs(t,di).forEach(([a,y])=>{const l=leg(a,y,t.transport);if(l&&!l.flight&&l.d>=1){
      if(t.transport==='car')b.move+=l.d*180;
      else if(t.transport==='walk')b.move+=l.d>30?(l.fare||Math.round(l.d*110/100)*100)*p:l.d>=3?1500*p:0;
      else b.move+=(l.fare||(l.d>30?Math.round(l.d*110/100)*100:l.d>15?3500:1500))*p;
    }});
  });
  if(t.transport==='car')b.move+=t.days.length*3000; // 주차
  return b;
}
function budgetHTML(){
  const t=S.trip,b=budgetCalc(),tot=b.sight+b.food+b.stay+b.move;
  const rows=[['입장 · 체험 · 쇼핑','sight','--c-famous'],['식비 · 특산물','food','--c-food'],['숙박',`stay`,'--c-stay'],['현지 이동 (추정)','move','--c-hidden']];

function tripText(){
  readTitle();const t=S.trip;let s=`# ${t.title}\n${t.region} · ${t.days.length-1}박 ${t.days.length}일 · ${t.req.theme}\n`;
  if(t.summary)s+=`\n${t.summary}\n`;
  if(t.specialties.length)s+=`\n지역 특산물: ${t.specialties.join(', ')}\n`;
  t.days.forEach((d,i)=>{s+=`\n## ${dayLabel(i)}${d.theme?' — '+d.theme:''}\n`;const an=prevAnchor(t,i),f=d.items.find(x=>x.lat!=null);if(an&&f){const l=leg(an,f,t.transport);s+=`(전날 ${an.name}에서 출발${l?` · 약 ${fmtMin(l.min)}`:''})\n`}d.items.forEach(x=>{s+=`- ${x.time} ${x.name} (${CAT[x.category].l})${x.cost?' · '+won(x.cost):''}\n  ${x.desc}${x.tip?' / 팁: '+x.tip:''}${x.access?' / 접근성: '+x.access:''}${x.memo?' / 메모: '+x.memo:''}\n  ${naver(x)}\n`})});
  const b=budgetCalc();s+=`\n예상 경비(${t.people}명): ${won(b.sight+b.food+b.stay+b.move)}\n\n— 전국 더하기로 만든 일정`;
  return s;
}
function tripDocHTML(forPrint){
  readTitle();const t=S.trip,b=budgetCalc();
  const col={famous:'#3b6fd8',hidden:'#2f9a5a',food:'#d9772b',market:'#b0478f',stay:'#7a6bd1'};
  let h=`<h1 style="font-size:26px;margin:0 0 4px">${esc(t.title)}</h1><p style="color:#666;margin:0 0 8px">${esc(t.region)} · ${t.days.length-1}박 ${t.days.length}일 · ${esc(t.req.theme)} · ${t.people}명</p>`;
  if(t.summary)h+=`<p>${esc(t.summary)}</p>`;
  if(t.specialties.length)h+=`<p><b>지역 특산물</b> ${t.specialties.map(esc).join(' · ')}</p>`;
  t.days.forEach((d,i)=>{
    h+=`<h2 style="font-size:19px;margin:22px 0 6px;border-bottom:2px solid #23876f;padding-bottom:4px">${dayLabel(i)}${d.theme?' — '+esc(d.theme):''}</h2><table style="width:100%;border-collapse:collapse;font-size:13px">`;
    d.items.forEach(x=>{h+=`<tr><td style="width:56px;vertical-align:top;padding:7px 6px;color:#555;border-bottom:1px solid #eee">${esc(x.time)}</td><td style="padding:7px 6px;border-bottom:1px solid #eee"><b>${esc(x.name)}</b> <span style="color:${col[x.category]};font-size:11px">${CAT[x.category].l}</span>${x.cost?` <span style="color:#888;font-size:11px">${won(x.cost)}</span>`:''}<br><span style="color:#444">${esc(x.desc)}</span>${x.tip?`<br><span style="color:#777">팁: ${esc(x.tip)}</span>`:''}${x.access?`<br><span style="color:#3b6fd8">접근성: ${esc(x.access)}</span>`:''}${x.memo?`<br><span style="color:#23876f">메모: ${esc(x.memo)}</span>`:''}${forPrint?'':`<br><a href="${naver(x)}">네이버 지도</a>`}</td></tr>`});
    h+='</table>';
  });
  h+=`<h2 style="font-size:19px;margin:22px 0 6px">예상 경비 (${t.people}명)</h2><p>입장·체험 ${won(b.sight)} · 식비 ${won(b.food)} · 숙박 ${won(b.stay)} · 현지 이동 ${won(b.move)}<br><b>합계 ${won(b.sight+b.food+b.stay+b.move)}</b> (1인 약 ${won((b.sight+b.food+b.stay+b.move)/t.people)})</p>`;
  h+=`<h2 style="font-size:19px;margin:22px 0 6px">준비물</h2><p>${t.checklist.map(c=>(c.d?'☑ ':'☐ ')+esc(c.t)).join('<br>')}</p><p style="color:#999;font-size:11px;margin-top:24px">전국 더하기 — 전국 지역의 활력을 더하다</p>`;
  return h;
}
async function copyGDoc(){

  catch{try{await navigator.clipboard.writeText(text);ok=true}catch{}}

}

async function saveFile(filename,data){
  if(downloadsNS){
    try{await downloadsNS.save({filename,data});toast('저장했어요');return}
    catch(e){if(e&&e.code==='declined')return;if(e&&['unavailable','not_granted','capability_disabled','capability_removed'].includes(e.code)){downloadsNS=null}else{toast('저장하지 못했어요: '+(e?.message||e?.code||''));return}}
  }
  try{
    const blob=data instanceof Blob?data:new Blob([data],{type:'text/plain'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);
  }catch{toast('이 보기에서는 파일 저장이 안 돼요. Google 문서로 복사를 이용해 주세요.')}
}

    await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');
    const area=$('#printArea');area.innerHTML=tripDocHTML(true);
    await document.fonts?.ready;
    const canvas=await html2canvas(area,{scale:2,backgroundColor:'#ffffff'});
    area.innerHTML='';
    const {jsPDF}=window.jspdf;const pdf=new jsPDF({unit:'pt',format:'a4'});
    const pw=pdf.internal.pageSize.getWidth(),ph=pdf.internal.pageSize.getHeight();
    const pxPerPage=Math.floor(canvas.width*ph/pw);
    for(let y=0,p=0;y<canvas.height;y+=pxPerPage,p++){
      const c=document.createElement('canvas');c.width=canvas.width;c.height=Math.min(pxPerPage,canvas.height-y);
      c.getContext('2d').drawImage(canvas,0,y,canvas.width,c.height,0,0,canvas.width,c.height);
      if(p)pdf.addPage();pdf.addImage(c.toDataURL('image/jpeg',.92),'JPEG',0,0,pw,c.height*pw/canvas.width);
    }
    await saveFile(fname('pdf'),pdf.output('blob'));
  }catch(e){console.error(e);toast('PDF를 만들지 못했어요. Google 문서로 복사 후 PDF로 받아 보세요.')}
}

function openPalette(){closeAll();$('#palette').classList.add('on');$('#scrim').classList.add('on');$('#palQ').value='';palSel=0;drawPal();$('#palQ').focus()}
function palItems(){const q=$('#palQ').value.trim().toLowerCase().replace(/\s/g,'');return CMDS.filter(c=>(!c.need||S.trip)&&(!q||c.l.toLowerCase().replace(/\s/g,'').includes(q)))}
function drawPal(){const it=palItems();palSel=Math.min(palSel,Math.max(0,it.length-1));$('#palList').innerHTML=it.map((c,i)=>`<li class="${i===palSel?'sel':''}" data-pi="${i}">${esc(c.l)}${c.k?`<kbd>${c.k}</kbd>`:''}</li>`).join('')||'<li style="color:var(--mute)">일치하는 명령이 없어요</li>'}
$('#palQ').addEventListener('input',()=>{palSel=0;drawPal()});
$('#palQ').addEventListener('keydown',e=>{
  const it=palItems();
  if(e.key==='ArrowDown'){e.preventDefault();palSel=(palSel+1)%Math.max(1,it.length);drawPal()}
  else if(e.key==='ArrowUp'){e.preventDefault();palSel=(palSel-1+it.length)%Math.max(1,it.length);drawPal()}
  else if(e.key==='Enter'){e.preventDefault();const c=it[palSel];if(c){closeAll();c.f()}}
});

document.addEventListener('keydown',e=>{
  const mod=e.metaKey||e.ctrlKey;
  if(mod&&e.key.toLowerCase()==='k'){e.preventDefault();$('#palette').classList.contains('on')?closeAll():openPalette();return}
  if(e.key==='Escape'){closeAll();return}
  const typing=/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)||document.activeElement.isContentEditable;
  if(mod&&e.key.toLowerCase()==='s'){e.preventDefault();saveTrip();return}
  if(typing)return;
  if(mod&&e.key.toLowerCase()==='z'){e.preventDefault();e.shiftKey?redo():undo();return}
  if(mod||e.altKey)return;
  if($('#modal').classList.contains('on')||$('#palette').classList.contains('on'))return;
  const k=e.key;
  if(k==='/'){e.preventDefault();window.scrollTo({top:0,behavior:'smooth'});$('#q').focus();return}
  if(k==='?'){showHelp();return}
  if(k==='d'||k==='D'){toggleDark();return}
  if(k===','){openSettings();return}
  if(k==='s'||k==='S'){openSaved();return}
  if(!S.trip)return;
  if(/^[1-9]$/.test(k)&&+k<=S.trip.days.length){S.day=+k-1;S.mapAll=false;renderTab();return}
  if(k==='ArrowRight'&&S.day<S.trip.days.length-1){S.day++;renderTab()}
  if(k==='ArrowLeft'&&S.day>0){S.day--;renderTab()}
  const tabs={p:'plan',m:'map',b:'budget',c:'check'};
  if(tabs[k.toLowerCase()]){S.tab=tabs[k.toLowerCase()];S.mapAll=false;render();return}
  if(k==='e'||k==='E'){exportMenu($('#btnExport').getBoundingClientRect())}
  if(k==='r'||k==='R')regenDay(S.day);
  if(k==='i'||k==='I'){e.preventDefault();$('#refineQ').focus()}
});
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change',()=>{if(S.settings.dark==null){applyDark();if(S.tab==='map')renderTab()}});

function demoRegion(r){const k=Object.keys(DEMO).find(k=>r.includes(k)||k.includes(r));return k}
async function demoTrip(req){
  await new Promise(r=>setTimeout(r,1400));
  const k=demoRegion(req.region);
  if(!k)throw new Error(`오프라인 데모에는 ${Object.keys(DEMO).join('·')}만 들어 있어요. 다른 지역은 AI 엔진(⌘K → 설정)으로 만들 수 있어요.`);
  const D=DEMO[k];
  const mk=a=>({name:a[0],category:a[1],desc:a[2],tip:a[3],cost:a[4],lat:a[5],lng:a[6],address:k});
  const pool=c=>D.p.filter(p=>p[1]===c).map(mk);
  const fam=pool('famous'),hid=pool('hidden'),food=pool('food'),mkt=pool('market'),stay=pool('stay');
  let di=0,mi=0;
  const used=new Set();let prev=null;
  const near=(arr)=>{const c=arr.filter(x=>!used.has(x.name));if(!c.length)return null;if(!prev)return c[0];c.sort((a,b)=>km(prev,a)-km(prev,b));return c[0]};
  const sight=()=>{const wantHidden=Math.random()*100<req.hidden;let x=wantHidden?(near(hid)||near(fam)):(near(fam)||near(hid));if(x){used.add(x.name);prev=x}return x};
  const eat=(arr,k)=>{const c=arr.filter(x=>!used.has(x.name));const x=(prev&&c.length?c.sort((a,b)=>km(prev,a)-km(prev,b))[0]:c[0])||arr[k%arr.length];used.add(x.name);prev=x;return x};
  const days=[];
  for(let d=0;d<req.days;d++){
    const last=d===req.days-1;
    const seq=[];seq.push(['09:30',sight(),90]);seq.push(['12:00',eat(food,di++),60]);seq.push(['13:30',sight(),90]);seq.push(['15:30',sight(),75]);seq.push(['17:30',eat(mkt,mi++),60]);seq.push(['19:00',eat(food,di++),70]);
    let items=seq.filter(s=>s[1]).map(([t,p,dur])=>({...p,time:t,duration:dur}));
    if(req.pace==='relaxed')items=items.filter((_,i)=>i!==3);
    if(last)items=items.slice(0,3);
    else if(stay[0])items.push({...stay[0],time:'21:00',duration:600});
    const seen=new Set();items=items.filter(x=>x.category==='stay'||x.category==='food'||!seen.has(x.name)&&seen.add(x.name));
    days.push({theme:d===0?`${k}의 대표 명소와 첫 맛`:last?'숨은 매력으로 마무리':'로컬처럼 걷는 하루',items});
  }
  if(accList(req).length)days.forEach(d=>d.items.forEach(x=>{x.access='데모 데이터에는 접근성 정보가 없어요 — 방문 전 확인 필요'}));
  return {title:`${k} ${req.nights}박 ${req.days}일 · ${req.theme}`,summary:`${k}의 대표 명소에 숨은 명소, 지역 특산물과 전통시장을 더한 일정이에요. (오프라인 데모 — 장소 정보는 참고용이에요)`,specialties:D.spec,days,checklist:['시장에서 쓸 현금 조금','운영시간·휴무일 확인',`${D.spec[0]} 맛보기`,'날씨 확인 후 겉옷 챙기기']};
}
function demoAlt(x,t){
  const k=demoRegion(t.region);if(!k)return null;
  const used=new Set(t.days.flatMap(d=>d.items.map(i=>i.name)));
  const c=DEMO[k].p.filter(p=>p[1]===x.category&&!used.has(p[0]));
  if(!c.length)return null;const a=c[Math.floor(Math.random()*c.length)];
  return {name:a[0],category:a[1],desc:a[2],tip:a[3],cost:a[4],lat:a[5],lng:a[6],address:k,duration:x.duration};
}
